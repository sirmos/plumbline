<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plumb Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="/design.css">
<script>try{var t=localStorage.getItem("pl-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/glass.js"></script>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/qr.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const ORIGIN=location.origin;
let TOKEN=null,ST=null,AI=false,AIS=[],VIEW="overview",BUSY={},SURE=null,PRD={},VERS=[{id:"web",name:"World English Bible"},{id:"kjv",name:"King James Version"},{id:"bbe",name:"Bible in Basic English"},{id:"webbe",name:"World English Bible, British"},{id:"oeb-us",name:"Open English Bible, US"},{id:"almeida",name:"Almeida (Português)"}],draft={sermon:""};
try{TOKEN=sessionStorage.getItem("pl-token");draft.sermon=sessionStorage.getItem("pl-sermon")||"";}catch(e){}

const MARK=`<span class="mark" aria-hidden="true"></span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500);}
async function api(path,method,body){
  const r=await fetch("/api/admin/"+path,{method:method||"GET",headers:{"content-type":"application/json",...(TOKEN?{authorization:"Bearer "+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&TOKEN){signOut();throw new Error(j.error||"Please sign in again.");}
  if(!r.ok)throw new Error(j.error||"Something went wrong.");return j;}
function setToken(t){TOKEN=t;try{t?sessionStorage.setItem("pl-token",t):sessionStorage.removeItem("pl-token");}catch(e){}}
function signOut(){setToken(null);ST=null;go();}
async function refresh(){const j=await api("state");ST=j.church;AI=j.aiLive;AIS=j.aiStatus||[];}

function plumb(score){const a=clamp(100-score,0,60)*0.3,cls=score>=85?"true":score>=65?"lean":"off",lbl=score>=85?"True":score>=65?"Leaning":"Off";
  return `<span class="plumb ${cls}" title="How closely this draft stays true to the source and your doctrine"><svg width="18" height="34" viewBox="0 0 18 34" aria-hidden="true"><line x1="9" y1="0" x2="9" y2="3" stroke="currentColor" stroke-width="1.4" opacity=".5"/><g transform="rotate(${a} 9 2)"><line x1="9" y1="2" x2="9" y2="25" stroke="currentColor" stroke-width="1.4"/><path d="M9 33 L5 25 L13 25 Z" fill="currentColor"/></g></svg><span><b>${lbl}</b><i>${score}/100</i></span></span>`;}
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago";};

/* ---------- auth screen ---------- */
function authView(){
  $("#root").innerHTML=`<div class="auth">
  <section class="nave"><div class="cord" aria-hidden="true"><i></i><span class="bob"></span></div>
   <div class="brand">${MARK}<span>Plumb Line</span></div>
   <h1>Help that stays true to what you believe.</h1>
   <p class="lead">An AI helper for your church website. It answers from what you have confirmed, protects people's privacy, and never sends anything until a pastor approves it.</p>
   <div class="glasswrap">${PlumbGlass.svg("sg")}</div>
   <div class="gems">
    <div><i style="background:#7C93FF"></i><b>Ask what they were afraid to ask</b>Answers come only from what you confirm.</div>
    <div><i style="background:#FFC857"></i><b>Prayer, reading, a blessing</b>Every note is approved by a person.</div>
    <div><i style="background:#F27C94"></i><b>One queue, one AI log</b>See what AI drafted and decide.</div>
   </div></section>
  <section class="enter"><button type="button" class="themebtn" data-theme-toggle>Dark or light</button>
    <form class="panel" id="login"><h3>Sign in</h3><p class="muted">Pastors and staff sign in here. Use the church ID shown in the sidebar.</p>
      <label>Church ID<input type="text" id="l-id" required autocomplete="username"></label>
      <label>Your name <span class="muted" style="font-weight:400">(staff only, leave empty if you are the pastor)</span><input type="text" id="l-user" maxlength="40" autocomplete="off"></label>
      <label>Passcode<input type="password" id="l-pass" required autocomplete="current-password"></label>
      <div class="err" id="l-err" role="alert"></div><div class="row"><button class="btn" id="l-btn">Sign in</button></div></form>
    <form class="panel" id="signup"><h3>New church? Set it up</h3><p class="muted">Takes two minutes. No credit card.</p>
      <label>Church name<input type="text" id="s-name" required maxlength="80" autocomplete="organization"></label>
      <label>Passcode (at least 8 characters)<input type="password" id="s-pass" required minlength="8" autocomplete="new-password"></label>
      <div class="err" id="s-err" role="alert"></div><div class="row"><button class="btn ghost" id="s-btn">Create my church</button></div></form>
  </section></div>`;
  $("#signup").onsubmit=async e=>{e.preventDefault();$("#s-btn").disabled=true;try{const j=await api("signup","POST",{name:$("#s-name").value,pass:$("#s-pass").value});setToken(j.token);await refresh();VIEW="start";go();}catch(er){$("#s-err").textContent=er.message;$("#s-btn").disabled=false;}};
  $("#login").onsubmit=async e=>{e.preventDefault();$("#l-btn").disabled=true;try{const j=await api("login","POST",{id:$("#l-id").value,user:$("#l-user").value,pass:$("#l-pass").value});setToken(j.token);await refresh();VIEW=ST.role==="team"?"prayers":"overview";go();}catch(er){$("#l-err").textContent=er.message;$("#l-btn").disabled=false;}};
}

/* ---------- app shell ---------- */
const NAV=[["Daily",[["overview","Overview"],["brief","Monday Brief"],["pulpit","Live Pulpit"],["queue","Review queue"],["sermon","Sermon to week"],["devotionals","Daily devotionals"],["library","Series & Bible studies"]]],
 ["People",[["visitors","Visitors"],["prayers","Prayer board"],["care","Care board"],["insight","What people carry"]]],
 ["Set up",[["team","Team & members"],["start","Get started"],["church","Church & features"],["doctrine","Doctrine & rules"],["faq","Guide answers"],["groups","Small groups"],["partners","Partner churches"]]],
 ["Publish",[["page","Church page"],["selftest","Self-test"],["install","Install on your website"],["policy","AI use policy"],["log","AI log"],["engine","AI engine"]]]];
const badge=k=>{if(k==="pulpit"&&PUL.live)return `<span class="count" style="background:var(--green)">live</span>`;const n=k==="queue"?ST.queue.filter(q=>q.status==="pending").length:k==="visitors"?ST.visitors.filter(v=>v.status==="new").length:k==="care"?ST.care.filter(x=>x.status==="new").length:k==="prayers"?(ST.prayers||[]).filter(x=>x.status==="new").length:0;return n?`<span class="count">${n}</span>`:"";};
const NAV_TEAM=new Set(["prayers","care","visitors"]);
const canSee=k=>ST.role==="team"?NAV_TEAM.has(k):k==="team"?ST.role==="pastor":true;
const ROLE_LABEL={pastor:"Pastor",admin:"Administrator",team:"Prayer and care team"};
function shell(inner){
  const pend=ST.queue.filter(q=>q.status==="pending").length;
  $("#root").innerHTML=`<div class="app"><aside>
   <div class="logo">${MARK}<b>Plumb Line</b></div>
   <div class="who"><b>${esc(ST.name)}</b><span>${ST.me&&ST.me!==ROLE_LABEL[ST.role]?esc(ST.me)+" · ":""}${ROLE_LABEL[ST.role]||"Pastor"}</span><span class="muted mono" style="font-size:12px">ID: ${esc(ST.id)}</span><span>${AI?'<span class="pill live">AI connected</span>':'<span class="pill wait">Offline mode</span>'}</span></div>
   <nav aria-label="Sections">${NAV.map(([g,items])=>[g,items.filter(([k])=>canSee(k))]).filter(([g,items])=>items.length).map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,l])=>`<button type="button" data-v="${k}" ${VIEW===k?'aria-current="page"':""}>${l}${badge(k)}</button>`).join("")).join("")}</nav>
   <div style="margin-top:auto;padding:0 8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="out">Sign out</button><button type="button" class="themebtn" data-theme-toggle>Dark or light</button></div></aside>
   <main class="content">${AI||ST.role==="team"?"":`<div class="banner">No AI provider is set up on this server, so drafts use simple rule-based output. Add a free key (for example Groq) to turn AI on. Everything else works.</div>`}${inner}</main></div>`;
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;go();window.scrollTo(0,0);});
  $("#out").onclick=signOut;
}
const intro=(h,p)=>`<div class="intro"><h2>${h}</h2><p class="muted">${p}</p></div>`;

/* ---------- views ---------- */
function reviewCard(q,controls){
  let body="";
  if(q.type==="sermon"){const P=q.payload.paragraphs||[];
    body=q.payload.days.map(d=>`<div class="day"><div class="d">DAY ${d.day}</div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div><span class="ref">${esc(d.passage)}</span> <b>${esc(d.theme)}</b></div><p>${esc(d.question)}</p><p class="muted">Try: ${esc(d.action)}</p><details><summary>${d.source.length?"Rests on "+d.source.map(n=>"paragraph "+n).join(", "):"Cites no sermon paragraph"}</summary>${d.source.map(n=>`<blockquote>${esc((P[n-1]||"").slice(0,240))}…</blockquote>`).join("")}</details></div></div>`).join("");
  }else if(q.status==="pending"&&q.type!=="urgent")body=`<label>Edit before approving<textarea data-edit="${q.id}" rows="7">${esc(q.body)}</textarea></label>`;
  else body=`<p style="white-space:pre-wrap">${esc(q.body)}</p>`;
  if(q.type==="followup"){const v=ST.visitors.find(x=>x.id===(q.meta||{}).visitor);body=`<div class="muted" style="font-size:13px">${v?`To: <b>${esc(v.contact)}</b> · wants to hear from us: ${v.pace==="now"?"this week":"after the second visit"}`:"This visitor's details were erased."}<br>Plumb Line never sends this for you. Copy it and send it from your own email or phone.</div>`+body;}
  const pill=q.status==="approved"?'<span class="pill ok">Approved</span>':q.status==="rejected"?'<span class="pill no">Rejected</span>':'<span class="pill wait">Needs your review</span>';
  return `<article class="card"><header><div class="meta"><div class="row"><span class="label">${esc(q.agent)}</span>${pill}<span class="muted" style="font-size:12px">${ago(q.at)}${q.live?"":" · fallback draft"}</span></div><h3>${esc(q.title)}</h3></div>${q.urgent?"":plumb(q.score)}</header><div class="body">${(q.flags||[]).map(f=>`<div class="flag ${q.urgent?"red":""}">${esc(f)}</div>`).join("")}${body}</div>${q.status==="approved"&&["letter","followup","checkin"].includes(q.type)?`<footer><button class="btn ghost sm" data-copyq="${q.id}">Copy message</button></footer>`:""}${q.status==="pending"&&controls!==false?`<footer><button class="btn" data-act="approve" data-id="${q.id}">${q.type==="urgent"?"I have reached out":"Approve"}</button>${q.type==="urgent"?"":`<button class="btn warn" data-act="reject" data-id="${q.id}">Reject</button>`}</footer>`:""}</article>`;}
function checklist(){
  const c=ST;
  const items=[
   ["Add your pastor's name and a way to reach a person",c.pastor!=="Pastor"&&!!c.contact,"church","Open"],
   ["Replace the sample guide answers with your own",!c.faq.some(f=>/Edit this answer/.test(f.a)),"faq","Open"],
   ["Install the widget on your website",c.stats.questions+c.stats.prayers+c.stats.moves+c.stats.visits>0,"install","Open"],
   ["Publish your first reading plan from a sermon",!!c.published,"sermon","Open"],
   ["Add your small groups so visitors can find one",c.groups.length>0,"groups","Open"],
   ["Get urgent care alerts pushed to your phone (Slack, Discord or Zapier)",!!c.alertWebhook,"church","Open"],
   ["Add a partner church (optional)",c.partners.length>0,"partners","Open"]];
  const done=items.filter(i=>i[1]).length;
  return `<section class="panel"><div class="row" style="justify-content:space-between"><h3>Your setup</h3><span class="mono muted">${done} of ${items.length}</span></div><div class="progress"><i style="width:${done/items.length*100}%"></i></div><div class="check-list">${items.map(i=>`<div class="step"><span class="dot ${i[1]?"done":""}">${i[1]?"✓":""}</span><span>${esc(i[0])}</span><button class="btn ghost sm" data-go="${i[2]}">${i[3]}</button></div>`).join("")}</div></section>`;}
const VIEWS={
 brief:()=>intro("Monday Brief","One page for the start of your week. Every number is counted by code from your own records. The AI only writes the wording around them, and any answer that contains a figure it was not given is thrown away.")+`<div id="br-root"><p class="muted">Loading…</p></div>`,
 pulpit:()=>intro("Live Pulpit","Show a QR code in the room. Anyone who scans it reads your service as live captions in their own language. Only the languages people currently have open are translated.")+`<div id="pl-root"><p class="muted">Loading…</p></div>`,
 start:()=>intro("Welcome, "+esc(ST.pastor==="Pastor"?"pastor":ST.pastor),"Plumb Line gives your church a helper that answers visitors, shares your weekly reading plan, receives prayer requests and writes letters of commendation. It drafts. You decide.")+checklist(),

 overview:()=>{
  const c=ST,days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push({d,...{q:0,v:0,p:0,h:0},...(c.daily[d]||{})});}
  const tot=k=>days.reduce((a,x)=>a+(x[k]||0),0),sum=x=>x.q+x.v+x.p+x.h,mx=Math.max(1,...days.map(sum));
  const nice=mx<=4?4:mx<=10?10:Math.ceil(mx/10)*10,W=640,H=170,L=34,B=22,bw=(W-L-6)/days.length;
  const bars=days.map((x,i)=>{let y=H-B;const X=L+i*bw+bw*.16;return ["h","p","v","q"].map(k=>{const h=(x[k]||0)/nice*(H-B-8);y-=h;return h>0?`<rect class="s-${k}" x="${X.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.68).toFixed(1)}" height="${h.toFixed(1)}"><title>${x.d}: ${x[k]}</title></rect>`:"";}).join("");}).join("");
  const grid=[0,.5,1].map(f=>{const y=H-B-f*(H-B-8);return `<line class="grid" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(nice*f)}</text>`;}).join("");
  const lab=days.map((x,i)=>i%3===0?`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${new Date(x.d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}</text>`:"").join("");
  const quiet=days.every(x=>!sum(x));
  const pend=c.queue.filter(q=>q.status==="pending"),urg=pend.filter(q=>q.urgent).length,nv=c.visitors.filter(v=>v.status==="new").length,nc=c.care.filter(x=>x.status==="new").length,gaps=c.friction.length;
  const need=[[urg,"urgent care alert"+(urg===1?"":"s"),"queue",true],[pend.length-urg,"draft"+(pend.length-urg===1?"":"s")+" waiting for your approval","queue"],[nv,"new visitor"+(nv===1?"":"s")+" to welcome","visitors"],[nc,"new care request"+(nc===1?"":"s"),"care"],[gaps,"question"+(gaps===1?"":"s")+" the guide could not answer","insight"]].filter(x=>x[0]>0);
  return intro("Overview","What happened across your website and congregation in the last 14 days, and what needs you.")+
  `<div class="stats"><div class="stat"><b>${tot("q")}</b><span class="muted">questions asked</span></div><div class="stat"><b>${tot("v")}</b><span class="muted">first-time visitors</span></div><div class="stat"><b>${tot("p")}</b><span class="muted">prayer requests</span></div><div class="stat"><b>${tot("h")}</b><span class="muted">help requests</span></div></div>
  <div class="two"><section class="panel"><h3>Needs you</h3>${need.length?need.map(n=>`<div class="need ${n[3]?"hot":""}"><span><b>${n[0]}</b> ${n[1]}</span><button class="btn ${n[3]?"":"ghost"} sm" data-go="${n[2]}">Open</button></div>`).join(""):`<p class="muted">You are caught up. Nothing is waiting.</p>`}</section>
  <section class="panel"><h3>Top unanswered questions</h3>${c.friction.length?`<div class="scroll"><table><tbody>${c.friction.slice(0,5).map((f,i)=>`<tr><td>${esc(f.q)}</td><td class="mono">${f.n}×</td><td><button class="btn ghost sm" data-addfaq="${i}">Add answer</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">When a visitor asks something your guide cannot answer, it shows up here so you can fix it.</p>`}</section></div>
  <section class="panel"><h3>Activity</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily activity for the last 14 days">${grid}${bars}${lab}</svg>
   <div class="legend"><span><i style="background:var(--sapphire)"></i>Questions</span><span><i style="background:var(--gold)"></i>First-time visitors</span><span><i style="background:var(--emerald)"></i>Prayer</span><span><i style="background:var(--ruby)"></i>Help requests</span></div>
   ${quiet?`<p class="muted">No activity yet. Once the widget is on your website, daily counts appear here. Only numbers are kept, never what people wrote.</p>`:""}</section>`;},
 visitors:()=>{
  const cols=[["new","New"],["contacted","Contacted"],["returned","Returned"],["connected","Connected"]],vs=ST.visitors,nope=vs.filter(v=>v.status==="closed");
  const card=v=>{const q=ST.queue.find(x=>x.meta&&x.meta.visitor===v.id),fu=q?(q.status==="pending"?'<span class="pill wait">Draft waiting</span>':q.status==="approved"?'<span class="pill ok">Follow-up approved</span>':'<span class="pill no">Draft rejected</span>'):"";
   return `<article class="kcard"><div class="row" style="justify-content:space-between"><b>${esc(v.name||"Visitor")}</b><span class="muted" style="font-size:12px">${ago(v.at)}</span></div>
   <div class="tags">${v.interests.map(i=>`<span class="pill">${esc(i)}</span>`).join("")}${v.kids?`<span class="pill">kids: ${esc(v.kids)}</span>`:""}</div>
   ${v.group?`<span class="muted" style="font-size:13px">Suggested group: ${esc(v.group)}</span>`:""}
   <div class="row"><span style="font-size:13px">${esc(v.contact)}</span><button class="btn ghost sm" data-copy="${esc(v.contact)}">Copy</button></div>
   <div class="row"><span class="pill">${v.pace==="now"?"contact this week":v.pace==="none"?"no contact":"after 2nd visit"}</span>${fu}${q&&q.status==="pending"?`<button class="btn ghost sm" data-go="queue">Review</button>`:""}</div>
   <select data-vstatus="${v.id}" aria-label="Status">${[...cols,["closed","No contact wanted"]].map(([k,l])=>`<option value="${k}" ${v.status===k?"selected":""}>${l}</option>`).join("")}</select>
   <button class="btn warn sm" data-verase="${v.id}">${SURE===v.id?"Confirm: erase everything":"Erase this person"}</button></article>`;};
  return intro("Visitors","People who left their details through the widget, with their consent. You decide who contacts them and when. Nothing is sent automatically.")+
  (vs.length?`<div class="kan">${cols.map(([k,l])=>{const list=vs.filter(v=>v.status===k);return `<div class="kcol"><h3>${l}<span class="pill">${list.length}</span></h3>${list.map(card).join("")||`<span class="muted" style="font-size:13px">None</span>`}</div>`;}).join("")}</div>`+(nope.length?`<details><summary>${nope.length} asked for no contact</summary><div class="kan" style="margin-top:12px">${nope.map(card).join("")}</div></details>`:""):
  `<div class="empty"><b>No visitors yet</b><span>Visitors appear when someone uses the "New here?" tab and chooses to leave contact details. People who prefer to stay anonymous still get their answers, and are only counted.</span><button class="btn" data-go="install">Install the widget</button></div>`);},
 prayers:()=>{const L=ST.prayers||[],st={new:"New",praying:"Praying",replied:"Replied",closed:"Closed"};
  const card=x=>`<article class="card"><header><div class="meta"><div class="row"><span class="pill">${esc(x.theme)}</span><span class="pill ${x.status==="new"?"wait":x.status==="closed"?"":"ok"}">${st[x.status]||x.status}</span><span class="muted" style="font-size:13px">${ago(x.at)}</span></div>
   <b>${esc(x.name||"Anonymous")}${x.contact?` · ${esc(x.contact)}`:""}</b></div></header>
   <div class="body"><p>${esc(x.text)}</p>
   ${x.reply?`<div class="flag" style="background:var(--green-bg);color:var(--green);border-left-color:var(--green)"><b>Sent to them ${ago(x.reply.at)}:</b> ${esc(x.reply.text)}</div>`:""}
   <label>${x.reply?"Write a new reply":"Your reply"}<textarea data-prtext="${x.id}" rows="3" maxlength="800" placeholder="Write a short, warm reply. They will see it in the prayer tab on your website.">${esc(PRD[x.id]||"")}</textarea></label><div data-prflag="${x.id}"></div></div>
   <footer><button class="btn sm" data-prsend="${x.id}">Send reply</button><button class="btn ghost sm" data-prdraft="${x.id}" ${BUSY["pd"+x.id]?"disabled":""}>${BUSY["pd"+x.id]?"Drafting…":"Draft with AI"}</button>${x.status==="new"?`<button class="btn ghost sm" data-prpray="${x.id}">Mark as praying</button>`:""}${x.status!=="closed"?`<button class="btn ghost sm" data-prclose="${x.id}">Close</button>`:""}<button class="btn warn sm" data-prerase="${x.id}">${SURE===x.id?"Confirm: erase":"Erase"}</button></footer></article>`;
  return intro("Prayer board","Requests people chose to share with your team. Private requests are never kept and never appear here. Your reply shows up for them in the prayer tab, with nothing sent by email or text.")+
  `<div class="banner">These requests are private. Anyone with access to this dashboard can read them. Erase a request when you no longer need it. People can also remove their own.</div>`+
  (L.length?`<div style="display:flex;flex-direction:column;gap:14px">${L.map(card).join("")}</div>`:`<div class="empty"><b>No shared requests yet</b><span>When someone ticks "Share with the prayer team" in the Prayer tab, their request lands here so you can pray and reply. Everyone else's stays private.</span><a class="btn ghost" href="/c/${esc(ST.id)}" target="_blank" rel="noopener">Try it on your church page</a></div>`);},
 devotionals:()=>{const L=(ST.devotionals||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)),today=new Date().toISOString().slice(0,10),drafts=L.filter(d=>d.status==="draft").length;
  const ver=v=>VERS.map(x=>`<option value="${x.id}" ${x.id===v?"selected":""}>${esc(x.name)}</option>`).join("");
  const card=d=>`<form class="card" data-dev="${d.id}"><header><div class="meta"><div class="row"><span class="pill ${d.status==="published"?"ok":"wait"}">${d.status==="published"?"Published":"Draft"}</span><b>${esc(d.date)}</b>${d.date===today?`<span class="pill">Today</span>`:""}</div>${(d.flags||[]).map(f=>`<div class="flag">${esc(f)}</div>`).join("")}</div></header>
   <div class="body"><div class="two"><label>Date<input type="date" data-f="date" value="${esc(d.date)}"></label><label>Title<input type="text" data-f="title" value="${esc(d.title)}" maxlength="100"></label></div>
   <div class="two"><label>Scripture reference<input type="text" data-f="ref" value="${esc(d.ref)}" maxlength="60" placeholder="John 3:16"></label><label>Version<select data-f="version">${ver(d.version||"web")}</select></label></div>
   <div class="row"><button type="button" class="btn ghost sm" data-lookup="${d.id}">Look up the text</button><span class="muted" style="font-size:13px">Public-domain versions only. You can also type or paste the verse from a version your church is licensed to use.</span></div>
   <label>Verse text (optional)<textarea data-f="text" rows="2" maxlength="3000">${esc(d.text||"")}</textarea></label>
   <label>Reflection<textarea data-f="reflection" rows="5" maxlength="1400">${esc(d.reflection)}</textarea></label>
   <label>Question for today<input type="text" data-f="question" value="${esc(d.question)}" maxlength="300"></label><label>Prayer<input type="text" data-f="prayer" value="${esc(d.prayer)}" maxlength="500"></label></div>
   <footer><button class="btn sm" data-devsave="${d.id}">Save</button>${d.status==="published"?`<button type="button" class="btn ghost sm" data-devpub="${d.id}" data-act="unpublish">Pull back to draft</button>`:`<button type="button" class="btn ghost sm" data-devpub="${d.id}" data-act="publish">Approve and publish</button>`}<button type="button" class="btn warn sm" data-deverase="${d.id}">${SURE===d.id?"Confirm: delete":"Delete"}</button></footer></form>`;
  return intro("Daily devotionals","A short reading with a verse, reflection, question and prayer for each day. Write a week or a month at once, edit what you like, then approve. People see each one in the Today tab on the day you choose.")+
  `<form class="panel" id="f-devgen"><div class="two"><label>What are they about?<input type="text" id="dg-topic" maxlength="200" placeholder="Trusting God in hard seasons"></label><label>Or work through a book or passage<input type="text" id="dg-pass" maxlength="120" placeholder="Philippians"></label></div>
   <div class="grid3"><label>How many days<select id="dg-days">${[[1,"1 day"],[7,"1 week (7 days)"],[14,"2 weeks"],[30,"A month (30 days)"]].map(([n,l])=>`<option value="${n}" ${n===7?"selected":""}>${l}</option>`).join("")}</select></label><label>Starting on<input type="date" id="dg-start" value="${today}"></label><span></span></div>
   <div class="row"><button class="btn" id="dg-btn" ${BUSY.dg?"disabled":""}>${BUSY.dg?"Writing…":"Write drafts"}</button><span class="muted">Drafts are not seen by anyone until you approve them.</span></div></form>`+
  (L.length?`<div class="row">${drafts?`<button class="btn ghost" id="dev-all">Approve and publish all ${drafts} drafts</button>`:""}</div><div style="display:flex;flex-direction:column;gap:14px">${L.map(card).join("")}</div>`:`<div class="empty"><b>No devotionals yet</b><span>Write the first week above. A verse of the day with a short reflection is a gentle way for people to come back to your church every day.</span></div>`);},
 library:()=>{const L=(ST.series||[]).slice().reverse(),today=new Date().toISOString().slice(0,10);
  const when=x=>x.cadence==="daily"?"Daily":"Weekly";
  const item=(x,it,i)=>`<details class="card" style="padding:0" ${i===0?"open":""}><summary style="padding:12px 16px;font-weight:650;color:var(--fg)">${it.n}. ${esc(it.title||"Untitled")}</summary><div class="body" data-item="${i}"><div class="two"><label>Title<input type="text" data-i="title" value="${esc(it.title)}" maxlength="100"></label><label>Passage<input type="text" data-i="passage" value="${esc(it.passage)}" maxlength="80"></label></div>
    <label>Summary<textarea data-i="summary" rows="4" maxlength="700">${esc(it.summary)}</textarea></label><label>Discussion questions (one per line)<textarea data-i="questions" rows="4">${esc((it.questions||[]).join("\n"))}</textarea></label>
    <label>Application<input type="text" data-i="application" value="${esc(it.application)}" maxlength="300"></label><label>Prayer<input type="text" data-i="prayer" value="${esc(it.prayer)}" maxlength="400"></label></div></details>`;
  const card=x=>`<article class="card" data-ser="${x.id}"><header><div class="meta"><div class="row"><span class="pill ${x.status==="published"?"ok":"wait"}">${x.status==="published"?"Published":"Draft"}</span><span class="pill">${x.kind==="study"?"Bible study":"Sermon series"}</span><span class="muted" style="font-size:13px">${when(x)} from ${esc(x.start)}, ${x.items.length} parts</span></div>${(x.flags||[]).map(f=>`<div class="flag">${esc(f)}</div>`).join("")}</div></header>
   <div class="body"><div class="two"><label>Title<input type="text" data-s="title" value="${esc(x.title)}" maxlength="100"></label><label>One-line description<input type="text" data-s="blurb" value="${esc(x.blurb||"")}" maxlength="300"></label></div>
   <div class="grid3"><label>Starts on<input type="date" data-s="start" value="${esc(x.start)}"></label><label>One part every<select data-s="cadence"><option value="weekly" ${x.cadence==="weekly"?"selected":""}>week</option><option value="daily" ${x.cadence==="daily"?"selected":""}>day</option></select></label><span></span></div>
   ${x.items.map((it,i)=>item(x,it,i)).join("")}</div>
   <footer><button class="btn sm" data-sersave="${x.id}">Save changes</button>${x.status==="published"?`<button class="btn ghost sm" data-serpub="${x.id}" data-act="unpublish">Pull back to draft</button>`:`<button class="btn ghost sm" data-serpub="${x.id}" data-act="publish">Approve and publish</button>`}<button class="btn ghost sm" data-serhand="${x.id}">Copy as handout</button><button class="btn warn sm" data-serdel="${x.id}">${SURE===x.id?"Confirm: delete":"Delete"}</button></footer></article>`;
  return intro("Series & Bible studies","Plan a sermon series or a small-group Bible study for 4 weeks, a quarter or any length. Each part gets a passage, a summary, discussion questions, an application and a prayer. People follow along in the Today tab, one part at a time.")+
  `<form class="panel" id="f-sergen"><div class="grid3"><label>What is it?<select id="sg-kind"><option value="study">Bible study (for small groups)</option><option value="series">Sermon series (with a study guide for each message)</option></select></label><label>Parts<select id="sg-count">${[[4,"4 (a month of weeks)"],[6,"6"],[8,"8"],[12,"12 (a quarter)"],[26,"26 (half a year)"]].map(([n,l])=>`<option value="${n}">${l}</option>`).join("")}</select></label><label>One part every<select id="sg-cad"><option value="weekly">week</option><option value="daily">day</option></select></label></div>
   <div class="two"><label>Topic<input type="text" id="sg-topic" maxlength="200" placeholder="The Sermon on the Mount"></label><label>Or book or passage<input type="text" id="sg-pass" maxlength="120" placeholder="Matthew 5-7"></label></div>
   <label>Anything you want emphasised (optional)<textarea id="sg-notes" rows="3" maxlength="1500" placeholder="For example: for young families, focus on practical application, avoid heavy theology."></textarea></label>
   <div class="grid3"><label>Starts on<input type="date" id="sg-start" value="${today}"></label><span></span><span></span></div>
   <div class="row"><button class="btn" id="sg-btn" ${BUSY.sg?"disabled":""}>${BUSY.sg?"Writing…":"Write the plan"}</button><span class="muted">It stays a draft until you approve it.</span></div></form>`+
  (L.length?`<div style="display:flex;flex-direction:column;gap:16px">${L.map(card).join("")}</div>`:`<div class="empty"><b>Nothing planned yet</b><span>Try "The Sermon on the Mount, 4 weeks" as a Bible study to see how it works.</span></div>`);},
 team:()=>{const S=ST.staff||[],M=ST.members||[],role={admin:"Administrator",team:"Prayer and care team"};
  return intro("Team & members","Give your staff and volunteers their own sign-in, and see who has made a member account. Visitors never need an account: they ask, request prayer and ask for help without signing in.")+
  `<div class="panel"><h3>Who can do what</h3><div class="scroll"><table><thead><tr><th>Person</th><th>How they sign in</th><th>What they can do</th></tr></thead><tbody>
   <tr><td><b>Pastor</b></td><td>Church ID and your passcode</td><td>Everything, including approving what goes out, publishing, doctrine, and managing the team.</td></tr>
   <tr><td><b>Administrator</b></td><td>Church ID, their name, their passcode</td><td>Everything except managing the team: queue, sermons, devotionals, studies, page, install, brief, live captions.</td></tr>
   <tr><td><b>Prayer and care team</b></td><td>Church ID, their name, their passcode</td><td>Only the Prayer board, Care board and Visitors. They can reply to prayer (signed with their name), update cards, and cannot publish, approve or delete.</td></tr>
   <tr><td><b>Member</b></td><td>Name and passcode in the widget (optional)</td><td>See their own shared prayer requests and replies on any phone, and delete their account.</td></tr>
   <tr><td><b>Visitor</b></td><td>No sign-in</td><td>Ask, find a group, request prayer or help, read the Today tab and live captions.</td></tr></tbody></table></div></div>
  <form class="panel" id="f-staff"><h3>Add a team member</h3><div class="grid3"><label>Name<input type="text" id="sf-name" maxlength="40" placeholder="Ruth Adeyemi"></label><label>Role<select id="sf-role"><option value="team">Prayer and care team</option><option value="admin">Administrator</option></select></label><label>Temporary passcode<input type="text" id="sf-pass" minlength="8" maxlength="200" placeholder="At least 8 characters"></label></div>
   <p class="muted">Tell them the church ID (<span class="mono">${esc(ST.id)}</span>), their name and this passcode, and ask them to sign in at your dashboard address. Removing or pausing someone signs them out immediately.</p><div class="row"><button class="btn">Add</button></div></form>
  <div class="panel"><h3>Your team</h3>${S.length?`<div class="check-list">${S.map(u=>`<div class="step" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${esc(u.name)}</b> <span class="pill ${u.off?"no":"ok"}">${u.off?"Paused":role[u.role]}</span><br><span class="muted" style="font-size:13px">${u.last?"Last signed in "+ago(u.last):"Has not signed in yet"}</span></span>
   <span class="row"><button class="btn ghost sm" data-streset="${u.id}">Reset passcode</button><button class="btn ghost sm" data-stoff="${u.id}" data-off="${u.off?0:1}">${u.off?"Resume":"Pause"}</button><button class="btn warn sm" data-stdel="${u.id}">${SURE===u.id?"Confirm: remove":"Remove"}</button></span></div>`).join("")}</div>`:`<p class="muted">No team members yet. You are the only person who can sign in.</p>`}</div>
  <div class="panel"><h3>Member accounts</h3><p class="muted">Members create these themselves from the Prayer tab. We keep only a name and a passcode, no email or phone. If someone forgets their passcode, reset it here and tell them in person.</p>
   ${M.length?`<div class="check-list">${M.map(m=>`<div class="step" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${esc(m.name)}</b><br><span class="muted" style="font-size:13px">Joined ${ago(m.at)} · ${m.prayers} shared request${m.prayers===1?"":"s"}</span></span><span class="row"><button class="btn ghost sm" data-mreset="${m.id}">Reset passcode</button><button class="btn warn sm" data-mdel="${m.id}">${SURE===m.id?"Confirm: remove":"Remove"}</button></span></div>`).join("")}</div>`:`<p class="muted">No member accounts yet.</p>`}</div>`;},
 care:()=>{
  const cols=[["new","New"],["inprogress","In progress"],["done","Done"]],list=ST.care,kinds={meal:"Meal",ride:"Ride",visit:"Visit or call",errand:"Errand",other:"Other"};
  const card=x=>`<article class="kcard"><div class="row" style="justify-content:space-between"><span class="pill">${kinds[x.kind]||"Other"}</span><span class="muted" style="font-size:12px">${ago(x.at)}</span></div>
   <p style="font-size:14px">${esc(x.text)}</p><div class="row"><span style="font-size:13px"><b>${esc(x.name||"Member")}</b> · ${esc(x.contact)}</span><button class="btn ghost sm" data-copy="${esc(x.contact)}">Copy</button></div>
   <div style="display:flex;flex-direction:column;gap:5px"><span class="label">Suggested steps</span>${x.tasks.map((t,i)=>`<label class="task ${t.done?"done":""}"><input type="checkbox" data-ctask="${x.id}" data-i="${i}" ${t.done?"checked":""}><span>${esc(t.t)}</span></label>`).join("")}</div>
   <input type="text" data-cassign="${x.id}" value="${esc(x.assignee)}" placeholder="Who is helping?" maxlength="60" aria-label="Assigned to">
   <select data-cstatus="${x.id}" aria-label="Status">${cols.map(([k,l])=>`<option value="${k}" ${x.status===k?"selected":""}>${l}</option>`).join("")}</select>
   <button class="btn warn sm" data-cerase="${x.id}">${SURE===x.id?"Confirm: erase request":"Erase request"}</button></article>`;
  return intro("Care board","Practical help members asked for: meals, rides, visits. A person on your team decides who helps. AI only suggests steps and never reads pastoral notes.")+
  (list.length?`<div class="kan">${cols.map(([k,l])=>{const l2=list.filter(x=>x.status===k);return `<div class="kcol"><h3>${l}<span class="pill">${l2.length}</span></h3>${l2.map(card).join("")||`<span class="muted" style="font-size:13px">None</span>`}</div>`;}).join("")}</div>`:
  `<div class="empty"><b>No requests yet</b><span>Members ask through the "Help" tab. Each request becomes a card with suggested steps. Turn on an alert address in Church &amp; features to be pushed a message when one arrives.</span><button class="btn ghost" data-go="church">Set up alerts</button></div>`);},
 groups:()=>intro("Small groups","List your groups. Visitors describe what they want in their own words and the widget suggests groups from this list. Only open groups are shown.")+
  `<form class="panel" id="f-groups">${ST.groups.length?ST.groups.map((g,i)=>`<div class="edit-row" data-i="${i}"><div style="display:flex;flex-direction:column;gap:8px"><div class="grid3"><input type="text" data-n placeholder="Group name" value="${esc(g.name)}" maxlength="80"><input type="text" data-d placeholder="Day, e.g. Thursday" value="${esc(g.day)}" maxlength="30"><input type="text" data-t placeholder="Time, e.g. 7:00 PM" value="${esc(g.time)}" maxlength="30"></div>
   <div class="grid3"><input type="text" data-a placeholder="Area or neighborhood" value="${esc(g.area)}" maxlength="60"><input type="text" data-s placeholder="Who it is for, e.g. young families" value="${esc(g.stage)}" maxlength="60"><input type="text" data-o placeholder="Topic, e.g. Bible study" value="${esc(g.topic)}" maxlength="60"></div>
   <textarea data-e placeholder="One or two sentences about what happens" maxlength="240" style="min-height:60px">${esc(g.desc)}</textarea><label class="check"><input type="checkbox" data-k ${g.open?"checked":""}>Open to new people</label></div><button type="button" class="btn warn sm" data-delgrp="${i}">Remove</button></div>`).join(""):`<p class="muted">No groups yet. Add the groups that meet at your church. Do not list member names or home addresses.</p>`}
  <div class="row"><button type="button" class="btn ghost" id="addgrp">Add a group</button><button class="btn">Save groups</button></div></form>`,
 selftest:()=>{const R=BUSY.selftest;return intro("Self-test","Checks, in one click, that everything your congregation will touch is ready, and tells you exactly how to fix anything that is not.")+
  `<div class="panel"><div class="row"><button class="btn" id="stbtn" ${BUSY.stbusy?"disabled":""}>${BUSY.stbusy?"Testing…":"Run self-test"}</button>${R?`<span class="pill ${R.passed===R.total?"ok":"wait"}">${R.passed} of ${R.total} ready</span>`:""}</div>
   ${R?`<div class="check-list">${R.results.map(x=>`<div class="step"><span class="dot ${x.ok?"done":""}">${x.ok?"✓":""}</span><span><b>${esc(x.name)}</b>${x.detail?`<br><span class="muted">${esc(x.detail)}</span>`:""}${x.ok?"":`<br><span style="color:var(--red)">${esc(x.fix)}</span>`}</span><span></span></div>`).join("")}</div>`:`<p class="muted">Nothing has been tested yet.</p>`}</div>`;},
 engine:()=>intro("AI engine","Every provider you add is another safety net. Plumb Line asks each one which models it offers today, tries the best match first, and moves to the next model or provider the moment one is busy, retired or returns something unusable. If everything fails, a plain rule-based draft is used, so the widget never goes silent.")+
  `<section class="panel"><div class="row" style="justify-content:space-between"><h3>Providers, in the order they are tried</h3><button class="btn" id="aitest" ${BUSY.aitest?"disabled":""}>${BUSY.aitest?"Testing…":"Test connections"}</button></div>
  ${BUSY.aires?`<div class="check-list">${BUSY.aires.map(r=>`<div class="step"><span class="dot ${r.ok?"done":""}">${r.ok?"✓":"!"}</span><span style="min-width:0"><b>${esc(r.name)}</b> <span class="muted mono" style="font-size:12px">${esc(r.model||"")}</span>${r.ok?"":`<div class="muted" style="font-size:12.5px">${esc(r.error)}${r.detail?": "+esc(r.detail):""}</div>`}</span><span class="mono">${r.ok?r.ms+" ms":"failed"}</span></div>`).join("")}</div>`:""}
  ${AIS.length?AIS.map((p,i)=>`<div class="card" style="margin-top:6px"><header><div class="meta"><div class="row"><span class="label">${i+1}</span><h3 style="text-transform:capitalize">${esc(p.name)}</h3>${p.state==="ready"?'<span class="pill ok">ready</span>':p.state==="partly limited"?'<span class="pill wait">partly limited</span>':'<span class="pill no">'+esc(p.state)+(p.coolSeconds?" "+p.coolSeconds+"s":"")+'</span>'}${p.privateOk?'<span class="pill ok">private text allowed</span>':'<span class="pill wait">public text only</span>'}</div>
    <span class="muted" style="font-size:13px">${p.listed!=null?p.listed+" models listed by the provider":esc(p.listErr||"model list not fetched yet")} · ${p.ok} answered · ${p.fail} failed${p.last&&p.last!=="ok"?" · last problem: "+esc(p.last)+(p.detail?" ("+esc(p.detail)+")":""):""}</span></div></header>
    <div class="body" style="padding:8px 18px"><div class="scroll"><table><thead><tr><th>Model</th><th>Used for</th><th>Status</th><th>Answered</th><th>Failed</th><th>Speed</th></tr></thead><tbody>${p.models.map(m=>`<tr><td class="mono" style="font-size:12px;word-break:break-all">${esc(m.id)}</td><td>${m.tier==="both"?"both":m.tier==="quick"?"fast":"careful"}</td><td>${m.state==="ready"?'<span class="pill ok">ready</span>':'<span class="pill wait">'+esc(m.state)+(m.coolSeconds?" "+m.coolSeconds+"s":"")+'</span>'}</td><td class="mono">${m.ok}</td><td class="mono">${m.fail}</td><td class="mono">${m.avgMs?m.avgMs+" ms":"–"}</td></tr>`).join("")}</tbody></table></div></div></div>`).join(""):
  `<div class="empty"><b>No AI provider is set up</b><span>Add at least one free key to a file named <span class="mono">.env</span> next to <span class="mono">server.js</span>, then restart. The list below shows where to get each.</span></div>`}</section>
  <section class="panel"><h3>Add more free providers</h3><p class="muted">Copy <span class="mono">.env.example</span> to <span class="mono">.env</span>, paste a key after the <span class="mono">=</span>, save, and restart the server. You do not need to type model names.</p>
  <div class="scroll"><table><tbody>
   <tr><td><b>GROQ_API_KEY</b></td><td>Also does the speech-to-text for Live Pulpit</td><td class="mono" style="font-size:12px">console.groq.com/keys</td></tr>
   <tr><td><b>CEREBRAS_API_KEY</b></td><td>Fast backup</td><td class="mono" style="font-size:12px">cloud.cerebras.ai</td></tr>
   <tr><td><b>GEMINI_API_KEY</b></td><td>Strong in many languages</td><td class="mono" style="font-size:12px">aistudio.google.com/apikey</td></tr>
   <tr><td><b>OPENROUTER_API_KEY</b></td><td>Many free models behind one key</td><td class="mono" style="font-size:12px">openrouter.ai/keys</td></tr>
   <tr><td><b>MISTRAL_API_KEY</b></td><td>Backup</td><td class="mono" style="font-size:12px">console.mistral.ai/api-keys</td></tr></tbody></table></div></section>
  <section class="panel"><h3>Private text and free tiers</h3><p class="muted">Prayer requests, care requests, visitor questions and member names are only sent to providers marked <b>private text allowed</b>. Gemini, Mistral and OpenRouter free tiers may use prompts to improve their products, so by default they only see public text such as sermon captions. While you test with made-up data you can allow them everywhere by adding <span class="mono">AI_ALLOW_TRAINING_PROVIDERS=true</span> to <span class="mono">.env</span>. Never do that with real members' information.</p></section>`,
 queue:()=>{const p=ST.queue.filter(q=>q.status==="pending"),d=ST.queue.filter(q=>q.status!=="pending").slice(0,10);
   return intro("Review queue","Nothing reaches your people until you approve it. Each card shows how closely the draft stays true to its source and your doctrine.")+
   (p.length?p.map(q=>reviewCard(q)).join(""):`<div class="panel" style="border-style:dashed;text-align:center;align-items:center"><p>Nothing is waiting for you.</p><p class="muted">Drafts appear when visitors, members or you start using the widget.</p><button class="btn" data-go="sermon">Draft a reading plan</button></div>`)+
   (d.length?`<h3>Decided</h3>`+d.map(q=>reviewCard(q,false)).join(""):"");},
 sermon:()=>intro("Sermon to week","Paste your sermon. The agent builds a five-day journey and shows which of your paragraphs each day rests on, so you can see where it drifted.")+
  `<div class="panel"><label>Your sermon, one paragraph per block<textarea id="sermon" rows="14" style="min-height:300px" placeholder="Paste or type your sermon here.">${esc(draft.sermon)}</textarea></label>
   <div class="row"><button class="btn" id="gen" ${BUSY.sermon?"disabled":""}>${BUSY.sermon?"Drafting…":"Draft the five days"}</button><span class="muted">Scripture is given as references only. The draft goes to your review queue.</span></div></div>`,
 insight:()=>{const c=ST,themes=["Health","Family","Work & provision","Grief","Faith & doubt","Guidance","Thanksgiving","Other"],max=Math.max(1,...themes.map(t=>c.themeCounts[t]||0));
  return intro("What people carry","Anonymous themes from prayer requests and the questions visitors could not get answered. No names. Prayer text is never stored.")+

/* ---------- Live Pulpit console ----------
   Lives outside the normal re-render so the microphone keeps running while the pastor moves between pages. */
const PUL={live:false,sid:null,mic:false,stream:null,rec:null,mime:"",ctx:null,an:null,peak:0,last:0,queue:[],busy:false,note:"",stats:{sent:0,skipped:0,failed:0},poll:null,data:null,wake:null};

async function plRefresh(){try{PUL.data=await api("pulpit");PUL.live=!!PUL.data.active;PUL.sid=PUL.data.active?PUL.data.active.sid:null;}catch(e){}}
function plNote(t){PUL.note=t;const n=$("#pl-note");if(n)n.textContent=t;}
function plDraw(){
  const root=$("#pl-root");if(!root||VIEW!=="pulpit")return;const D=PUL.data;if(!D){root.innerHTML='<p class="muted">Loading…</p>';return;}
  const A=D.active, noStt=!D.sttLive;
  if(!A){
    root.innerHTML=(noStt?`<div class="banner">No speech provider is set up on this server, so the microphone cannot be used. Add <span class="mono">GROQ_API_KEY</span> (free), or type captions yourself after you start.</div>`:"")+
    `<form class="panel" id="pl-start"><h3>Start a service</h3>
      <div class="two"><label>Title<input type="text" id="pl-title" maxlength="80" value="Sunday service"></label>
      <label>Language you will speak<select id="pl-lang">${D.languages.map(l=>`<option ${l==="English"?"selected":""}>${esc(l)}</option>`).join("")}</select></label></div>
      <p class="muted" style="font-size:13.5px">Speech recognition is strongest for English, Spanish, French, Portuguese, Swahili, Arabic, Chinese and Hindi. It is weaker for Yoruba, Hausa and Igbo, so check a few lines before relying on those as the language you speak.</p>
      <div class="row"><button class="btn" id="pl-go">Start service</button></div></form>`+plPast();
    $("#pl-start").onsubmit=async e=>{e.preventDefault();$("#pl-go").disabled=true;try{await api("pulpit/start","POST",{title:$("#pl-title").value,lang:$("#pl-lang").value});await plRefresh();await refresh();plDraw();go();}catch(er){toast(er.message);$("#pl-go").disabled=false;}};
    root.querySelectorAll("[data-tx]").forEach(b=>b.onclick=async()=>{try{const j=await api("pulpit/transcript?id="+b.dataset.tx);download((j.title||"service").replace(/[^\w-]+/g,"-")+".txt",j.text,"text/plain");}catch(er){toast(er.message);}});
    return;
  }
  const url=viewerUrl(), v=A.viewers||{}, total=Object.values(v).reduce((a,b)=>a+b,0);
  root.innerHTML=`<div class="pl-grid">
    <section class="panel"><span class="label">Scan to follow along</span><div class="qrbox">${PlumbQR.svg(url,{size:240})}</div>
      <div class="mono" style="font-size:12px;word-break:break-all">${esc(url)}</div>
      <div class="row"><button class="btn ghost sm" id="pl-copy">Copy link</button><a class="btn ghost sm" href="${esc(url)}" target="_blank" rel="noopener" style="text-decoration:none">Open viewer</a></div>
      <span class="label" style="margin-top:6px">In the room right now</span>
      <div class="row" id="pl-views">${plViews(v)}</div></section>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(A.title)}</h3><span class="pill live">Live · ${esc(A.lang)}</span></div>
        ${noStt?`<div class="banner">No speech provider is set up, so type captions below.</div>`:`<div class="row"><button class="btn" id="pl-mic">${PUL.mic?"Stop microphone":"Start microphone"}</button><div class="meter" style="flex:1;min-width:120px" aria-hidden="true"><i id="pl-lvl"></i></div></div>
        <p class="muted" id="pl-note" role="status" style="font-size:13.5px">${esc(PUL.note||"Press Start microphone and speak. Keep this tab open during the service.")}</p>`}
        <form class="row" id="pl-type" style="flex-wrap:nowrap"><input type="text" id="pl-line" maxlength="400" placeholder="Or type a caption and press Enter" aria-label="Type a caption" style="flex:1"><button class="btn ghost">Send</button></form>
      </section>
      <section class="panel"><h3>Latest captions</h3><div id="pl-recent">${plRecent(A)}</div>
        <div class="row" style="justify-content:space-between"><span class="muted" id="pl-stats" style="font-size:13px">${plStats(A)}</span><button class="btn warn sm" id="pl-end">End service</button></div></section>
    </div></div>`+plPast();
  $("#pl-copy").onclick=()=>copy(url);
  if($("#pl-mic"))$("#pl-mic").onclick=()=>PUL.mic?plMicStop():plMicStart();
  $("#pl-type").onsubmit=async e=>{e.preventDefault();const t=$("#pl-line").value.trim();if(!t)return;$("#pl-line").value="";try{await api("pulpit/line","POST",{sid:PUL.sid,text:t});plTick();}catch(er){toast(er.message);}};
  $("#pl-end").onclick=async()=>{if(!confirm("End this service? Viewers will see that it has ended and the transcript is saved."))return;plMicStop();try{await api("pulpit/end","POST",{sid:PUL.sid});await plRefresh();await refresh();go();toast("Service ended. Transcript saved.");}catch(er){toast(er.message);}};
  root.querySelectorAll("[data-tx]").forEach(b=>b.onclick=async()=>{try{const j=await api("pulpit/transcript?id="+b.dataset.tx);download((j.title||"service").replace(/[^\w-]+/g,"-")+".txt",j.text,"text/plain");}catch(er){toast(er.message);}});

const plViews=v=>Object.keys(v).length?Object.entries(v).map(([l,n])=>`<span class="chip">${esc(l)}</span>`).join(""):`<span class="muted" style="font-size:13.5px">Nobody has opened the page yet.</span>`;
const plRecent=A=>A.recent.length?A.recent.slice().reverse().map(x=>`<div class="cap"><span class="n">${x.n}</span><span>${esc(x.o)}</span><span class="muted mono" style="font-size:11px">${x.langs.length?x.langs.length+" lang":""}</span></div>`).join(""):`<p class="muted">Nothing yet. Captions appear here as you speak or type.</p>`;
const plStats=A=>`${A.lines} lines · ${A.stats.silent} silent chunks skipped · ${A.stats.failed} speech errors · ${A.stats.translateFailed} translation errors`+(A.stats.why?` · last problem: ${A.stats.why}`:"");
function plPast(){const sv=(ST.pulpit&&ST.pulpit.services)||[];return sv.length?`<section class="panel"><h3>Past services</h3><div class="scroll"><table><tbody>${sv.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${new Date(x.at).toLocaleString()}</span></td><td class="mono">${x.count} lines</td><td><button class="btn ghost sm" data-tx="${esc(x.id)}">Download transcript</button></td></tr>`).join("")}</tbody></table></div><p class="muted" style="font-size:13px">Only the text you spoke is saved, not translations. It can feed Sermon to week.</p></section>`:"";}
async function plTick(){
  if(!TOKEN){return;}
  try{await plRefresh();}catch(e){}
  if(VIEW!=="pulpit"||!$("#pl-root"))return;
  const A=PUL.data&&PUL.data.active;
  if(!!A!==!!$("#pl-end")||(A&&$("#pl-views")===null)){plDraw();return;}
  if(A){$("#pl-views").innerHTML=plViews(A.viewers||{});$("#pl-recent").innerHTML=plRecent(A);$("#pl-stats").textContent=plStats(A);}
}
function plStartPoll(){clearInterval(PUL.poll);PUL.poll=setInterval(plTick,2500);}
async function initPulpit(){PUL.data=PUL.data||null;plDraw();await plRefresh();plDraw();plStartPoll();}

async function plMicStart(){
  try{
    PUL.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){plNote("The microphone was blocked. Allow it in the browser's address bar, then try again.");return;}
  PUL.mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
  if(!window.MediaRecorder){plNote("This browser cannot record audio. Use Chrome, Edge or Safari, or type captions.");return;}
  PUL.mic=true;PUL.peak=0;
  try{PUL.ctx=new (window.AudioContext||window.webkitAudioContext)();PUL.an=PUL.ctx.createAnalyser();PUL.an.fftSize=1024;PUL.ctx.createMediaStreamSource(PUL.stream).connect(PUL.an);plMeter();}catch(e){}
  try{if(navigator.wakeLock)PUL.wake=await navigator.wakeLock.request("screen");}catch(e){}
  const b=$("#pl-mic");if(b)b.textContent="Stop microphone";plNote("Listening. Speak normally.");plCycle();
}
function plMicStop(){
  PUL.mic=false;clearTimeout(PUL.cycle);try{if(PUL.rec&&PUL.rec.state!=="inactive")PUL.rec.stop();}catch(e){}
  if(PUL.stream)PUL.stream.getTracks().forEach(t=>t.stop());PUL.stream=null;
  try{if(PUL.ctx)PUL.ctx.close();}catch(e){}PUL.ctx=null;PUL.an=null;try{if(PUL.wake)PUL.wake.release();}catch(e){}
  const b=$("#pl-mic");if(b)b.textContent="Start microphone";const l=$("#pl-lvl");if(l)l.style.width="0";plNote("Microphone is off.");
}
function plMeter(){
  if(!PUL.an||!PUL.mic)return;const buf=new Float32Array(PUL.an.fftSize);PUL.an.getFloatTimeDomainData(buf);
  let sum=0;for(const x of buf)sum+=x*x;const rms=Math.sqrt(sum/buf.length);PUL.peak=Math.max(PUL.peak,rms);
  const l=$("#pl-lvl");if(l)l.style.width=Math.min(100,rms*400)+"%";requestAnimationFrame(plMeter);
}
// Record in short, complete files. Each one is a valid audio file the speech service can read on its own.
function plCycle(){
  if(!PUL.mic||!PUL.stream)return;
  const rec=new MediaRecorder(PUL.stream,PUL.mime?{mimeType:PUL.mime}:{}),parts=[],peak0=()=>{const p=PUL.peak;PUL.peak=0;return p;};
  rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};
  rec.onstop=()=>{const p=peak0();if(!parts.length)return;const blob=new Blob(parts,{type:rec.mimeType||PUL.mime||"audio/webm"});
    if(p<0.008){PUL.stats.skipped++;return;}  // quiet room: do not spend speech quota on silence
    PUL.queue.push(blob);while(PUL.queue.length>3){PUL.queue.shift();plNote("Falling behind. The oldest audio was dropped to keep captions live.");}plSend();};
  rec.start();PUL.rec=rec;PUL.cycle=setTimeout(()=>{try{rec.stop();}catch(e){}plCycle();},7000);
}
async function plSend(){
  if(PUL.busy)return;PUL.busy=true;
  while(PUL.queue.length&&PUL.sid){
    const blob=PUL.queue.shift();
    try{
      const r=await fetch("/api/admin/pulpit/audio?sid="+encodeURIComponent(PUL.sid),{method:"POST",headers:{authorization:"Bearer "+TOKEN,"content-type":blob.type},body:blob});
      const j=await r.json().catch(()=>({}));
      if(r.status===401){plMicStop();signOut();break;}
      if(r.status===503||r.status===404){plNote(j.error||"The server could not take audio.");plMicStop();break;}
      if(!r.ok){PUL.stats.failed++;plNote(j.error||"A chunk was rejected. Carrying on.");continue;}
      if(j.ok===false){PUL.stats.failed++;plNote("Speech service is busy ("+(j.tried||[]).join(", ")+"). Carrying on; type a caption if it persists.");continue;}
      if(j.text){PUL.last=Date.now();plNote("Heard: "+j.text.slice(0,90));}
    }catch(e){PUL.stats.failed++;plNote("Connection problem. Carrying on.");}
  }
  PUL.busy=false;
}

const BR={data:null,busy:false};
async function brLoad(){try{BR.data=await api("brief");}catch(e){toast(e.message);}brDraw();}
function brDelta(x){return x.change===0?`<span class="muted">same as before</span>`:x.change>0?`<span style="color:var(--green)">▲ ${x.change} more</span>`:`<span style="color:var(--amber)">▼ ${-x.change} fewer</span>`;}
function brDraw(){

  const f=D.facts,w=f.week,L=D.latest,R=D.records;

  const rows=(arr,fn,empty)=>arr.length?arr.map(fn).join(""):`<p class="muted" style="font-size:13.5px">${empty}</p>`;
  root.innerHTML=
  (L?`<section class="card"><header><div class="meta"><span class="label">Week ending ${esc(L.weekEnding)} · written ${ago(L.at)}</span><h3>${esc(L.headline)}</h3></div><span class="pill ${L.live?"ok":"wait"}" title="Which AI wrote this wording">${L.live?esc(L.via):"Rule-based"}</span></header>
    <div class="body"><p>${esc(L.summary)}</p>
      <div><span class="label">Three things to do</span>${L.actions.map((a,i)=>`<div class="need"><span><b>${i+1}. ${esc(a.title)}</b><br><span class="muted">${esc(a.why)}</span></span><button class="btn ghost sm" data-brgo="${esc(a.view)}">Open</button></div>`).join("")}</div></div>
    <footer><button class="btn" id="br-new" ${BR.busy?"disabled":""}>${BR.busy?"Writing…":"Write a new brief"}</button><button class="btn ghost" id="br-copy">Copy as email</button><button class="btn ghost" id="br-dl">Download .txt</button></footer></section>`
  :`<div class="empty"><b>No brief yet</b><span>The counts below are live. Press the button to have the wording written.</span><button class="btn" id="br-new" ${BR.busy?"disabled":""}>${BR.busy?"Writing…":"Write this week's brief"}</button></div>`)+
  `<section class="panel"><div class="row" style="justify-content:space-between"><h3>Counted this week</h3><span class="pill">Counted by code, not AI</span></div>
    <div class="stats">${tile(w.questions.n,"questions asked",brDelta(w.questions))}${tile(w.firstVisits.n,"first-time visitors",brDelta(w.firstVisits))}${tile(w.prayers.n,"prayer requests",brDelta(w.prayers))}${tile(w.careRequests.n,"care requests",brDelta(w.careRequests))}${tile(w.groupSearches.n,"group searches",brDelta(w.groupSearches))}${tile(f.liveServices.count,"services captioned",f.liveServices.captionLines+" caption lines")}</div></section>
  <section class="panel"><h3>Waiting on a person</h3>
    <div class="stats">${tile(f.drafts.waitingForApproval,"drafts to approve",f.drafts.urgentAlerts?`<b style="color:var(--red)">${f.drafts.urgentAlerts} urgent</b>`:"oldest "+f.drafts.oldestWaitingDays+" d")}${tile(f.care.open,"open care requests",f.care.waitingOverThreshold+" waited "+f.thresholds.staleCareDays+"+ days · "+f.care.unassigned+" unassigned")}${tile(f.visitors.newToWelcome,"visitors to welcome",f.visitors.waitingOverThreshold+" waited "+f.thresholds.staleVisitorDays+"+ days")}</div></section>
  <section class="panel"><h3>Behind the numbers</h3><details open><summary>Questions people asked that your guide could not answer</summary>${rows(R.unanswered,x=>`<div class="need"><span>${esc(x.question)}</span><span class="mono">${x.n}×</span></div>`,"None this week.")}${R.unanswered.length?`<div class="row"><button class="btn ghost sm" data-brgo="faq">Add answers</button></div>`:""}</details>
    <details><summary>Visitors still waiting for a welcome (${R.staleVisitors.length})</summary>${rows(R.staleVisitors,x=>`<div class="need"><span>${esc(x.name)}</span><span class="mono">${x.days} days</span></div>`,"Nobody is waiting longer than "+f.thresholds.staleVisitorDays+" days.")}${R.staleVisitors.length?`<div class="row"><button class="btn ghost sm" data-brgo="visitors">Open visitors</button></div>`:""}</details>
    <details><summary>Care requests that have waited (${R.staleCare.length})</summary>${rows(R.staleCare,x=>`<div class="need"><span>${esc(x.kind)} · ${x.assignee?esc(x.assignee):"unassigned"}</span><span class="mono">${x.days} days</span></div>`,"No open request has waited "+f.thresholds.staleCareDays+" days.")}${R.staleCare.length?`<div class="row"><button class="btn ghost sm" data-brgo="care">Open care board</button></div>`:""}</details>
    <details><summary>Drafts waiting for you (${R.pending.length})</summary>${rows(R.pending,x=>`<div class="need ${x.urgent?"hot":""}"><span><b>${esc(x.title)}</b></span><span class="mono">${x.days} d</span></div>`,"Nothing is waiting.")}${R.pending.length?`<div class="row"><button class="btn ghost sm" data-brgo="queue">Open review queue</button></div>`:""}</details></section>`;
  root.querySelectorAll("[data-brgo]").forEach(b=>b.onclick=()=>{VIEW=b.dataset.brgo;go();window.scrollTo(0,0);});

  const dl=$("#br-dl");if(dl)dl.onclick=()=>download("monday-brief-"+L.weekEnding+".txt",D.email,"text/plain");
}

document.addEventListener("click",e=>{const b=e.target.closest("[data-theme-toggle]");if(!b)return;const r=document.documentElement,dark=r.getAttribute("data-theme")?r.getAttribute("data-theme")==="dark":matchMedia("(prefers-color-scheme: dark)").matches,n=dark?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("pl-theme",n);}catch(er){}});

  if(!TOKEN||!ST)return authView();
  if(!canSee(VIEW))VIEW=ST.role==="team"?"prayers":"overview";
  shell((VIEWS[VIEW]||VIEWS.overview)());bind();
}
